<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>INKSHELF — Manhwa &amp; Light Novel Tracker</title>
    <meta name="theme-color" content="#0a0a0b" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0a0b'/%3E%3Crect x='6' y='7' width='7' height='18' rx='1.5' fill='%2322d3ee'/%3E%3Crect x='15' y='7' width='7' height='18' rx='1.5' fill='%23f59e0b'/%3E%3Crect x='24' y='7' width='3' height='18' rx='1.5' fill='%23e63946'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap"
    />
    <style>
      :root {
        --ink: #0a0a0b;
        --ink-2: #111113;
        --ink-3: #17171a;
        --line: #26262b;
        --line-2: #35353d;
        --txt: #f4f4f5;
        --txt-2: #a1a1aa;
        --txt-3: #71717a;
        --cyan: #22d3ee;
        --amber: #f59e0b;
        --red: #e63946;
        --dur: 220ms;
        --ease: cubic-bezier(0.22, 0.8, 0.3, 1);
        --tap: 44px;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        background: var(--ink);
        color: var(--txt);
        font: 400 15px/1.55 Inter, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        min-height: 100vh;
        padding-bottom: 86px;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        opacity: 0.5;
        background-image: radial-gradient(rgba(255, 255, 255, 0.07) 1px, transparent 1.2px);
        background-size: 5px 5px;
      }
      .x-wrap { position: relative; z-index: 1; max-width: 1180px; margin: 0 auto; padding: 0 16px; }
      h1, h2, h3, .x-bebas {
        font-family: "Bebas Neue", Impact, sans-serif;
        font-weight: 400;
        letter-spacing: 0.04em;
        margin: 0;
        line-height: 1;
      }
      button, input, select { font: inherit; color: inherit; }
      button { cursor: pointer; }
      a { color: var(--cyan); }

      /* top bar */
      .x-top {
        position: sticky; top: 0; z-index: 40;
        background: rgba(10, 10, 11, 0.9);
        backdrop-filter: blur(14px);
        border-bottom: 1px solid var(--line);
      }
      .x-top__in { display: flex; align-items: center; gap: 12px; padding: 10px 16px; max-width: 1180px; margin: 0 auto; }
      .x-logo { display: flex; align-items: baseline; gap: 8px; }
      .x-logo b { font-family: "Bebas Neue", sans-serif; font-size: 30px; letter-spacing: 0.08em; font-weight: 400; }
      .x-logo b i { font-style: normal; color: var(--red); }
      .x-logo span { font-size: 10px; letter-spacing: 0.22em; color: var(--txt-3); text-transform: uppercase; }
      .x-top__sp { flex: 1; }
      .x-iconbtn {
        min-width: var(--tap); min-height: var(--tap);
        display: inline-flex; align-items: center; justify-content: center;
        background: var(--ink-3); border: 1px solid var(--line); border-radius: 10px;
        transition: border-color var(--dur) var(--ease), transform var(--dur) var(--ease);
      }
      .x-iconbtn:hover { border-color: var(--line-2); transform: translateY(-1px); }
      .x-iconbtn svg { width: 19px; height: 19px; }

      /* skewed section header */
      .x-sechead { display: flex; align-items: center; gap: 12px; margin: 26px 0 14px; }
      .x-sechead__tag {
        transform: skewX(-12deg);
        background: var(--txt); color: var(--ink);
        padding: 4px 14px 3px;
        font-family: "Bebas Neue", sans-serif; font-size: 22px; letter-spacing: 0.08em;
      }
      .x-sechead__tag.is-red { background: var(--red); color: #fff; }
      .x-sechead__rule { flex: 1; height: 1px; background: linear-gradient(90deg, var(--line-2), transparent); }
      .x-sechead__note { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--txt-3); }

      /* panels */
      .x-panel {
        background: var(--ink-2); border: 1px solid var(--line); border-radius: 14px;
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.03);
      }

      /* search */
      .x-searchrow { display: flex; gap: 8px; flex-wrap: wrap; }
      .x-field { position: relative; flex: 1 1 220px; min-width: 0; }
      .x-field svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 17px; height: 17px; color: var(--txt-3); }
      .x-input {
        width: 100%; min-height: var(--tap);
        background: var(--ink-3); border: 1px solid var(--line); border-radius: 12px;
        padding: 10px 12px 10px 36px; outline: none;
        transition: border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
      }
      .x-input:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.14); }
      .x-input::placeholder { color: var(--txt-3); }
      .x-seg { display: inline-flex; background: var(--ink-3); border: 1px solid var(--line); border-radius: 12px; padding: 3px; }
      .x-seg button {
        min-height: 38px; padding: 0 14px; border: 0; background: none; border-radius: 9px;
        font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--txt-2);
        transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
      }
      .x-seg button[aria-pressed="true"] { background: var(--txt); color: var(--ink); }
      .x-seg.is-cyan button[aria-pressed="true"] { background: var(--cyan); color: #04282e; }
      .x-seg.is-amber button[aria-pressed="true"] { background: var(--amber); color: #2a1a00; }

      /* chips / toolbar */
      .x-chips { display: flex; gap: 8px; flex-wrap: wrap; }
      .x-chip {
        min-height: 36px; padding: 0 13px; border-radius: 999px;
        background: transparent; border: 1px solid var(--line-2); color: var(--txt-2);
        font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
        transition: all var(--dur) var(--ease);
      }
      .x-chip[aria-pressed="true"] { background: var(--txt); border-color: var(--txt); color: var(--ink); }
      .x-select {
        min-height: 36px; background: var(--ink-3); border: 1px solid var(--line); border-radius: 999px;
        padding: 0 10px; font-size: 12px; color: var(--txt-2);
      }

      /* tabs */
      .x-tabs { display: flex; gap: 6px; border-bottom: 1px solid var(--line); overflow-x: auto; }
      .x-tab {
        background: none; border: 0; border-bottom: 2px solid transparent;
        padding: 10px 4px; min-height: var(--tap); white-space: nowrap;
        font-family: "Bebas Neue", sans-serif; font-size: 20px; letter-spacing: 0.06em; color: var(--txt-3);
        margin-right: 14px; transition: color var(--dur) var(--ease), border-color var(--dur) var(--ease);
      }
      .x-tab em { font-style: normal; font-family: Inter, sans-serif; font-size: 11px; font-weight: 700; color: var(--txt-3); margin-left: 6px; vertical-align: 3px; }
      .x-tab[aria-selected="true"] { color: var(--txt); border-color: var(--red); }
      .x-tab[aria-selected="true"] em { color: var(--red); }

      /* grid + cards */
      .x-grid { display: grid; gap: 14px; grid-template-columns: repeat(2, minmax(0, 1fr)); margin-top: 16px; }
      @media (min-width: 620px) { .x-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
      @media (min-width: 900px) { .x-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; } }
      @media (min-width: 1100px) { .x-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
      .x-card {
        position: relative; background: var(--ink-2); border: 1px solid var(--line);
        border-radius: 14px; overflow: hidden; display: flex; flex-direction: column;
        transform-style: preserve-3d;
        transition: border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease), transform 120ms var(--ease);
      }
      .x-card:hover { border-color: var(--line-2); box-shadow: 0 14px 34px -18px var(--glow, rgba(230,57,70,0.8)), 0 0 0 1px rgba(255,255,255,0.03); }
      .x-card__media { position: relative; aspect-ratio: 2 / 3; background: var(--ink-3); overflow: hidden; }
      .x-card__media img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 400ms var(--ease); }
      .x-card:hover .x-card__media img { transform: scale(1.04); }
      .x-card__open { position: absolute; inset: 0; border: 0; background: none; width: 100%; }
      .x-badge {
        position: absolute; top: 8px; left: 8px; z-index: 2;
        font-size: 9px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase;
        padding: 4px 7px; border-radius: 5px; transform: skewX(-10deg);
      }
      .x-badge.is-manhwa { background: var(--cyan); color: #04282e; }
      .x-badge.is-ln { background: var(--amber); color: #2a1a00; }
      .x-score {
        position: absolute; top: 8px; right: 8px; z-index: 2; font-size: 10px; font-weight: 700;
        background: rgba(10,10,11,0.82); border: 1px solid var(--line-2); border-radius: 5px; padding: 3px 6px;
      }
      .x-card__body { padding: 10px; display: flex; flex-direction: column; gap: 7px; flex: 1; }
      .x-card__title { font-size: 13px; font-weight: 600; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
      .x-card__meta { font-size: 11px; color: var(--txt-3); }
      .x-bar { height: 4px; border-radius: 3px; background: #26262b; overflow: hidden; }
      .x-bar i { display: block; height: 100%; border-radius: 3px; background: var(--glow, var(--red)); box-shadow: 0 0 10px var(--glow, var(--red)); transition: width 320ms var(--ease); }
      .x-prog { display: flex; align-items: center; gap: 6px; }
      .x-step {
        width: 34px; height: 34px; border-radius: 9px; background: var(--ink-3); border: 1px solid var(--line);
        display: inline-flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700;
        transition: all var(--dur) var(--ease);
      }
      .x-step:hover { border-color: var(--glow, var(--red)); color: #fff; }
      .x-num {
        flex: 1; min-height: 34px; background: var(--ink-3); border: 1px solid var(--line); border-radius: 9px;
        font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; padding: 0 4px;
      }
      .x-num input { width: 100%; text-align: center; background: none; border: 0; outline: none; font-weight: 700; }
      .x-card__acts { display: flex; gap: 6px; }
      .x-mini {
        flex: 1; min-height: 32px; border-radius: 8px; background: transparent; border: 1px solid var(--line);
        font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--txt-2);
        transition: all var(--dur) var(--ease);
      }
      .x-mini:hover { border-color: var(--line-2); color: var(--txt); }
      .x-mini.is-danger:hover { border-color: var(--red); color: var(--red); }
      .x-unit { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--txt-3); background: none; border: 0; text-decoration: underline dotted; }

      /* menu */
      .x-menu { position: absolute; z-index: 60; background: var(--ink-3); border: 1px solid var(--line-2); border-radius: 12px; padding: 6px; min-width: 170px; box-shadow: 0 20px 50px -20px #000; }
      .x-menu button { display: block; width: 100%; text-align: left; background: none; border: 0; border-radius: 8px; padding: 9px 10px; min-height: 40px; font-size: 13px; color: var(--txt-2); }
      .x-menu button:hover { background: #22222a; color: var(--txt); }
      .x-menu hr { border: 0; border-top: 1px solid var(--line); margin: 5px 2px; }

      /* list rows (search results) */
      .x-res { display: grid; gap: 10px; margin-top: 14px; }
      @media (min-width: 760px) { .x-res { grid-template-columns: 1fr 1fr; } }
      .x-row {
        display: flex; gap: 12px; padding: 10px; text-align: left; width: 100%;
        background: var(--ink-2); border: 1px solid var(--line); border-radius: 14px;
        transition: border-color var(--dur) var(--ease), transform var(--dur) var(--ease);
      }
      .x-row:hover { border-color: var(--line-2); transform: translateY(-2px); }
      .x-row__cover { width: 64px; flex: 0 0 64px; aspect-ratio: 2/3; border-radius: 9px; overflow: hidden; background: var(--ink-3); position: relative; }
      .x-row__cover img { width: 100%; height: 100%; object-fit: cover; }
      .x-row__main { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 4px; }
      .x-row__t { font-size: 14px; font-weight: 600; line-height: 1.3; }
      .x-row__s { font-size: 11px; color: var(--txt-3); }
      .x-tags { display: flex; gap: 5px; flex-wrap: wrap; }
      .x-tag { font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--txt-2); border: 1px solid var(--line); border-radius: 999px; padding: 2px 7px; }
      .x-flag { display: inline-block; font-size: 9px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; padding: 3px 6px; border-radius: 4px; transform: skewX(-10deg); }
      .x-flag.is-manhwa { background: var(--cyan); color: #04282e; }
      .x-flag.is-ln { background: var(--amber); color: #2a1a00; }

      /* empty / notices */
      .x-empty { text-align: center; padding: 40px 16px; }
      .x-bubble {
        position: relative; display: inline-block; max-width: 420px;
        background: var(--ink-2); border: 1px solid var(--line-2); border-radius: 18px; padding: 18px 22px;
      }
      .x-bubble::after { content: ""; position: absolute; left: 34px; bottom: -11px; width: 18px; height: 18px; background: var(--ink-2); border-right: 1px solid var(--line-2); border-bottom: 1px solid var(--line-2); transform: rotate(45deg) skewX(-6deg); }
      .x-bubble h3 { font-size: 26px; margin-bottom: 6px; }
      .x-bubble p { margin: 0; font-size: 13px; color: var(--txt-2); }
      .x-note { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 14px; padding: 12px 14px; border: 1px dashed var(--line-2); border-radius: 12px; font-size: 13px; color: var(--txt-2); }
      .x-skel { background: linear-gradient(90deg, #15151a, #1d1d24, #15151a); background-size: 200% 100%; animation: x-sh 1.3s linear infinite; border-radius: 14px; }
      @keyframes x-sh { to { background-position: -200% 0; } }

      /* sheet */
      .x-scrim { position: fixed; inset: 0; z-index: 70; background: rgba(4,4,6,0.72); backdrop-filter: blur(6px); animation: x-fade var(--dur) var(--ease); }
      @keyframes x-fade { from { opacity: 0; } }
      .x-sheet {
        position: fixed; z-index: 71; left: 0; right: 0; bottom: 0; max-height: 92vh; overflow: auto;
        background: var(--ink-2); border-top: 1px solid var(--line-2);
        border-radius: 18px 18px 0 0; animation: x-up 280ms var(--ease);
      }
      @keyframes x-up { from { transform: translateY(26px); opacity: 0.4; } }
      @media (min-width: 760px) {
        .x-sheet { left: 50%; right: auto; bottom: auto; top: 50%; transform: translate(-50%, -50%); width: min(720px, 92vw); border-radius: 18px; border: 1px solid var(--line-2); max-height: 88vh; }
        @keyframes x-up { from { transform: translate(-50%, -46%); opacity: 0.4; } }
      }
      .x-sheet__banner { position: relative; height: 150px; background: #1b1b22; }
      .x-sheet__banner img { width: 100%; height: 100%; object-fit: cover; }
      .x-sheet__banner::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, var(--ink-2), transparent 75%); }
      .x-sheet__close { position: absolute; top: 10px; right: 10px; z-index: 3; }
      .x-sheet__in { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
      .x-sheet h2 { font-size: 30px; }
      .x-dl { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; margin: 0; }
      .x-dl div { background: var(--ink-3); border: 1px solid var(--line); border-radius: 11px; padding: 9px 11px; }
      .x-dl dt { font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--txt-3); }
      .x-dl dd { margin: 3px 0 0; font-size: 14px; font-weight: 600; }
      .x-desc { font-size: 13px; color: var(--txt-2); }
      .x-desc.is-clamped { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
      .x-btns { display: flex; gap: 8px; flex-wrap: wrap; }
      .x-btn {
        min-height: var(--tap); padding: 0 16px; border-radius: 11px;
        background: var(--ink-3); border: 1px solid var(--line-2); color: var(--txt);
        font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
        transition: all var(--dur) var(--ease);
      }
      .x-btn:hover { transform: translateY(-1px); border-color: var(--txt-3); }
      .x-btn.is-primary { background: var(--red); border-color: var(--red); color: #fff; }
      .x-btn.is-ghost { background: none; }
      .x-link { background: none; border: 0; color: var(--cyan); font-size: 12px; font-weight: 600; text-decoration: underline; padding: 0; min-height: 0; }

      /* toasts */
      .x-toasts { position: fixed; z-index: 90; left: 50%; transform: translateX(-50%); bottom: 96px; display: flex; flex-direction: column; gap: 8px; width: min(440px, calc(100vw - 24px)); }
      .x-toast {
        display: flex; align-items: center; gap: 10px;
        background: #1b1b21; border: 1px solid var(--line-2); border-left: 3px solid var(--cyan);
        border-radius: 12px; padding: 10px 12px; font-size: 13px; box-shadow: 0 18px 40px -18px #000;
        animation: x-toast 260ms var(--ease);
      }
      @keyframes x-toast { from { transform: translateY(14px); opacity: 0; } }
      .x-toast span { flex: 1; }
      .x-toast button { background: none; border: 0; color: var(--cyan); font-weight: 700; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; min-height: 32px; }

      /* bottom tabs */
      .x-bottom {
        position: fixed; z-index: 50; bottom: 0; left: 0; right: 0;
        background: rgba(10,10,11,0.94); backdrop-filter: blur(14px); border-top: 1px solid var(--line);
        display: flex; padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
      }
      .x-bottom button {
        flex: 1; min-height: 52px; background: none; border: 0; border-radius: 12px;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
        font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--txt-3);
      }
      .x-bottom button svg { width: 20px; height: 20px; }
      .x-bottom button[aria-current="true"] { color: var(--txt); }
      .x-bottom button[aria-current="true"] svg { color: var(--red); }
      .x-foot { text-align: center; font-size: 11px; color: var(--txt-3); padding: 34px 0 10px; letter-spacing: 0.06em; }
      /* readability: 12px minimum, AA contrast, 44px targets */
      :root { --txt-3: #9a9aa4; }
      .x-logo span, .x-sechead__note, .x-seg button, .x-tab em, .x-badge, .x-score, .x-card__meta,
      .x-mini, .x-unit, .x-row__s, .x-tag, .x-flag, .x-dl dt, .x-bottom button, .x-foot,
      .x-panel > p { font-size: 12px !important; }
      .x-logo span, .x-sechead__note, .x-dl dt { letter-spacing: 0.1em; }
      .x-seg button { min-height: var(--tap); }
      .x-btn.is-primary { background: #c42532; border-color: #c42532; }
      /* account pill + sync */
      .x-pill {
        min-height: var(--tap); max-width: 46vw; display: inline-flex; align-items: center; gap: 8px;
        padding: 0 14px; background: var(--ink-3); border: 1px solid var(--line); border-radius: 999px;
        font-size: 12px; font-weight: 600; color: var(--txt-2);
        transition: border-color var(--dur) var(--ease), transform var(--dur) var(--ease);
      }
      .x-pill:hover { border-color: var(--line-2); transform: translateY(-1px); }
      .x-pill__e { color: var(--txt); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
      .x-pill__e:empty { display: none; }
      .x-pill__s { white-space: nowrap; }
      .x-pill__e:not(:empty) + .x-pill__s::before { content: "· "; }
      .x-pill__dot { display: inline-block; flex: none; width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--txt-3); }
      .x-pill__dot[data-s="synced"] { background: var(--cyan); border-color: var(--cyan); }
      .x-pill__dot[data-s="syncing"] { background: var(--amber); border-color: var(--amber); animation: x-pulse 1s ease-in-out infinite alternate; }
      .x-pill__dot[data-s="offline"], .x-pill__dot[data-s="error"] { border-color: var(--red); }
      @keyframes x-pulse { to { opacity: 0.35; } }
      @media (max-width: 520px) { .x-pill__e { display: none; } .x-pill__s::before { content: none !important; } }
      @media (max-width: 430px) {
        .x-pill { width: var(--tap); padding: 0; justify-content: center; flex: none; }
        .x-pill__s, .x-logo span { display: none; }
      }
      .x-syncsec { display: flex; flex-direction: column; gap: 10px; }
      .x-syncform { display: flex; gap: 8px; flex-wrap: wrap; }
      .x-syncform .x-input { flex: 1 1 220px; width: auto; }
      .x-input--plain { padding-left: 12px; }
      .x-syncmail { overflow-wrap: anywhere; }

    <!-- app: js/store.js + js/api.js + js/ui-library.js + js/ui-search.js + js/main.js + js/sync.js, concatenated in that order -->
    <script>
/* ============ INKSHELF · store.js ============
   The single place shelf data changes. Every write goes through
   saveItem / removeItem / importJSON, and every write is announced
   through onChange, so a sync layer (Supabase) can hook in later. */
(function () {
  const Ink = (window.Ink = window.Ink || {});
  const KEY = "inkshelf.v1";
  const STATUSES = ["plan", "reading", "completed"];
  const KINDS = ["manhwa", "lightnovel"];

  let items = {};
  let persistent = true;
  const subs = new Set();

  const clone = (o) => JSON.parse(JSON.stringify(o));

  function load() {
    try {
      const raw = window.localStorage.getItem(KEY);
      const parsed = raw ? JSON.parse(raw) : null;
      items = parsed && parsed.items && typeof parsed.items === "object" ? parsed.items : {};
    } catch (e) {
      persistent = false;
      items = {};
    }
  }

  function persist() {
    if (!persistent) return;
    try {
      window.localStorage.setItem(KEY, JSON.stringify({ version: 1, items }));
    } catch (e) {
      persistent = false; // quota or private mode: keep working in memory
    }
  }

  function emit(change) {
    subs.forEach((fn) => {
      try {
        fn(change);
      } catch (e) {
        console.error("[store] listener failed", e);
      }
    });
  }

  function normProgress(p, kind) {
    p = p || {};
    const n = (v) => Math.max(0, Math.floor(Number(v) || 0));
    return {
      chapter: n(p.chapter),
      volume: n(p.volume),
      unit: kind === "lightnovel" && p.unit === "volume" ? "volume" : "chapter",
    };
  }

  function normalize(input, prev) {
    const base = prev || {};
    const kind = KINDS.includes(input.kind) ? input.kind : base.kind || "manhwa";
    const status = STATUSES.includes(input.status) ? input.status : base.status || "plan";
    return {
      item_key: String(input.item_key || base.item_key),
      kind,
      status,
      progress: normProgress(Object.assign({}, base.progress, input.progress), kind),
      data: Object.assign({}, base.data, input.data),
      added_at: base.added_at || input.added_at || Date.now(),
      updated_at: input.updated_at && input.keepTime ? input.updated_at : Date.now(),
    };
  }

  /** Create or update one item. Partial updates merge into the existing item. */
  function saveItem(input, opts) {
    if (!input || !input.item_key) throw new Error("saveItem needs an item_key");
    const prev = items[input.item_key] ? clone(items[input.item_key]) : null;
    const next = normalize(input, prev);
    items[next.item_key] = next;
    persist();
    emit({ type: prev ? "update" : "add", key: next.item_key, item: clone(next), prev, source: (opts && opts.source) || "local" });
    return clone(next);
  }

  function removeItem(key, opts) {
    const prev = items[key];
    if (!prev) return null;
    delete items[key];
    persist();
    emit({ type: "remove", key, item: null, prev: clone(prev), source: (opts && opts.source) || "local" });
    return clone(prev);
  }

  function getAll() {
    return Object.values(items).map(clone);
  }

  function get(key) {
    return items[key] ? clone(items[key]) : null;
  }

  function has(key) {
    return Object.prototype.hasOwnProperty.call(items, key);
  }

  function onChange(fn) {
    subs.add(fn);
    return () => subs.delete(fn);
  }

  function exportJSON() {
    return JSON.stringify({ app: "inkshelf", version: 1, exported_at: new Date().toISOString(), items: getAll() }, null, 2);
  }

  /** Import a previous export. mode "merge" keeps the newer copy of each item; "replace" wipes first. */
  function importJSON(text, mode) {
    let parsed;
    try {
      parsed = JSON.parse(text);
    } catch (e) {
      throw new Error("That file isn't valid JSON.");
    }
    const list = Array.isArray(parsed) ? parsed : parsed && (Array.isArray(parsed.items) ? parsed.items : parsed.items && Object.values(parsed.items));
    if (!Array.isArray(list)) throw new Error("No shelf items found in that file.");
    const valid = list.filter((it) => it && it.item_key && it.data && it.data.title);
    if (mode === "replace") {
      items = {};
    }
    let added = 0;
    let updated = 0;
    valid.forEach((it) => {
      const cur = items[it.item_key];
      if (cur && (cur.updated_at || 0) >= (it.updated_at || 0)) return;
      const next = normalize(Object.assign({}, it, { keepTime: true }), null);
      next.added_at = it.added_at || next.added_at;
      cur ? updated++ : added++;
      items[next.item_key] = next;
    });
    persist();
    emit({ type: "import", key: null, item: null, prev: null, source: "import" });
    return { added, updated, skipped: list.length - added - updated };
  }

  function counts() {
    const c = { plan: 0, reading: 0, completed: 0, manhwa: 0, lightnovel: 0, total: 0 };
    Object.values(items).forEach((it) => {
      c[it.status]++;
      c[it.kind]++;
      c.total++;
    });
    return c;
  }

  // Another tab changed the shelf: reload and announce it.
  window.addEventListener("storage", (e) => {
    if (e.key !== KEY) return;
    load();
    emit({ type: "external", key: null, item: null, prev: null, source: "storage" });
  });

  load();

  Ink.store = {
    STATUSES,
    KINDS,
    saveItem,
    removeItem,
    getAll,
    get,
    has,
    onChange,
    exportJSON,
    importJSON,
    counts,
    isPersistent: () => persistent,
  };
})();
/* ============ INKSHELF · api.js ============
   Every lookup goes through the app's own Supabase backend
   (Postgres RPCs, live server-side search, nothing stored):
     search_series  {q, kind}  → {mu:[...], al:[...], errors:[...]}
     series_details {mu_id}    → one MangaUpdates series in full
   MangaUpdates is primary; AniList entries are matched onto it by
   title for covers, colors and counts. Results are already filtered to
   the chosen kind server-side, and are never widened to the other kind. */
(function () {
  const Ink = (window.Ink = window.Ink || {});
  const CONFIG = (Ink.CONFIG = Ink.CONFIG || {
    SUPABASE_URL: "https://dqrbdwahwetzramtyznw.supabase.co",
    SUPABASE_KEY: "sb_publishable_odBpCQOBmT1YY3j8o903ZA_kTPtUQW2",
  });
  const TIMEOUT = 12000;
  const CACHE_KEY = "inkshelf.search.v2";

  /* ---------- transport ---------- */
  function rpc(name, body, outer) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), TIMEOUT);
    const onOuter = () => ctrl.abort();
    if (outer) outer.addEventListener("abort", onOuter);
    return fetch(`${CONFIG.SUPABASE_URL}/rest/v1/rpc/${name}`, {
      method: "POST",
      headers: { apikey: CONFIG.SUPABASE_KEY, "Content-Type": "application/json", Accept: "application/json" },
      body: JSON.stringify(body),
      signal: ctrl.signal,
    })
      .then((r) => {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .finally(() => {
        clearTimeout(timer);
        if (outer) outer.removeEventListener("abort", onOuter);
      });
  }

  const abortErr = () => new DOMException("aborted", "AbortError");

  /* ---------- text helpers ---------- */
  const norm = (s) =>
    String(s || "")
      .toLowerCase()
      .normalize("NFKD")
      .replace(/[\u0300-\u036f]/g, "")
      .replace(/[^\p{L}\p{N}]+/gu, " ")
      .trim();

  /** "Solo Leveling (Novel)" → "Solo Leveling" */
  const cleanTitle = (s) =>
    String(s || "")
      .replace(/\s*\((?:light\s+)?novel\)/gi, "")
      .trim();

  const decode = (s) =>
    s
      .replace(/&quot;/g, '"')
      .replace(/&#0?39;|&apos;/g, "'")
      .replace(/&lt;/g, "<")
      .replace(/&gt;/g, ">")
      .replace(/&nbsp;/g, " ")
      .replace(/&amp;/g, "&");

  /** Plain text: no HTML, no markdown or BBCode links, no "Original Novel:" links block. */
  function cleanDesc(s) {
    let t = String(s || "")
      .replace(/<br\s*\/?>/gi, "\n")
      .replace(/<\/p>/gi, "\n\n");
    const cut = t.search(/(?:\*\*|__|<b>|\[b\])?\s*original\s+(?:web\s*)?novels?\s*:/i);
    if (cut > 0) t = t.slice(0, cut);
    t = t
      .replace(/!\[[^\]]*\]\([^)]*\)/g, "")
      .replace(/\[([^\]]+)\]\((?:https?:)?[^)]*\)/g, "$1")
      .replace(/\[url=[^\]]*\]([\s\S]*?)\[\/url\]/gi, "$1")
      .replace(/\[\/?[a-z]+(?:=[^\]]*)?\]/gi, "")
      .replace(/<[^>]+>/g, "")
      .replace(/(\*\*|__)(.*?)\1/g, "$2")
      .replace(/https?:\/\/\S+/g, "");
    return decode(t)
      .replace(/[ \t]+\n/g, "\n")
      .replace(/\n{3,}/g, "\n\n")
      .trim();
  }

  function bigrams(s) {
    const out = new Map();
    for (let i = 0; i < s.length - 1; i++) {
      const g = s.slice(i, i + 2);
      out.set(g, (out.get(g) || 0) + 1);
    }
    return out;
  }
  function dice(a, b) {
    if (!a || !b) return 0;
    if (a === b) return 1;
    const A = bigrams(a);
    const B = bigrams(b);
    let hit = 0;
    A.forEach((n, g) => (hit += Math.min(n, B.get(g) || 0)));
    return (2 * hit) / (Math.max(1, a.length - 1) + Math.max(1, b.length - 1));
  }
  function titleScore(q, t) {
    const a = norm(q);
    const b = norm(t);
    if (!a || !b) return 0;
    if (a === b) return 100;
    if (b.startsWith(a)) return 88;
    if (b.includes(a)) return 76;
    const qt = a.split(" ");
    const tt = new Set(b.split(" "));
    const overlap = qt.filter((w) => tt.has(w)).length / qt.length;
    return Math.max(overlap * 65, dice(a.replace(/ /g, ""), b.replace(/ /g, "")) * 70);
  }

  /** Strip subtitles, season tags and filler so a long title can still match. */
  function simplify(q) {
    let s = String(q).split(/[:\-–—|(\[]/)[0];
    s = s.replace(/\b(season|part|vol(ume)?|s)\s*\d+\b/gi, " ").replace(/\b(the|a|an|novel|manhwa|webtoon|ln)\b/gi, " ");
    s = norm(s).replace(/\s+/g, " ").trim();
    return s.length >= 2 ? s : norm(q);
  }

  const uniq = (list) => {
    const seen = new Set();
    return list.filter((t) => {
      const k = norm(t);
      if (!t || !k || seen.has(k)) return false;
      seen.add(k);
      return true;
    });
  };

  /* ---------- sources ---------- */
  function fromMU(m, kind) {
    const title = cleanTitle(m.title);
    const hit = cleanTitle(m.hit_title);
    const rating = Number(m.rating);
    return {
      source: "mangaupdates",
      muId: String(m.mu_id),
      anilistId: null,
      malId: null,
      title,
      sub: hit && norm(hit) !== norm(title) ? hit : "",
      alt: uniq([title, hit]),
      cover: m.cover || "",
      color: "",
      banner: "",
      kind,
      format: m.type === "Novel" ? "NOVEL" : m.type ? String(m.type).toUpperCase() : "",
      country: m.type === "Manhwa" ? "KR" : "",
      status: "",
      chapters: null,
      volumes: null,
      lastChapter: null,
      score: rating > 0 ? Math.round(rating * 10) : null,
      votes: Number(m.votes) || 0,
      genres: m.genres || [],
      desc: cleanDesc(m.description),
      url: m.url || "",
      year: Number(m.year) || null,
    };
  }

  function fromAniList(m, kind) {
    const t = m.title || {};
    const title = cleanTitle(t.english || t.romaji || t.native);
    return {
      source: "anilist",
      muId: null,
      anilistId: m.id,
      malId: m.idMal || null,
      title,
      sub: "",
      alt: uniq([title, t.romaji, t.english, t.native].concat(m.synonyms || []).map(cleanTitle)),
      cover: (m.coverImage && m.coverImage.extraLarge) || "",
      color: (m.coverImage && m.coverImage.color) || "",
      banner: m.bannerImage || "",
      kind,
      format: m.format || "",
      country: m.countryOfOrigin || "",
      status: m.status || "",
      chapters: m.chapters || null,
      volumes: m.volumes || null,
      lastChapter: null,
      score: m.averageScore || null,
      votes: 0,
      genres: m.genres || [],
      desc: "",
      url: m.siteUrl || "",
      year: (m.startDate && m.startDate.year) || null,
    };
  }

  /* ---------- merge, rank ---------- */
  function keyOf(r) {
    if (r.muId) return "mu:" + r.muId;
    if (r.anilistId) return "anilist:" + r.anilistId;
    if (r.malId) return "mal:" + r.malId;
    return "md:" + r.mdId;
  }

  /** Every key an item may already be saved under (old al:/mal: keys included). */
  function keysOf(r) {
    const out = [];
    if (r.item_key) out.push(r.item_key);
    if (r.muId) out.push("mu:" + r.muId);
    if (r.anilistId) out.push("anilist:" + r.anilistId, "al:" + r.anilistId);
    if (r.malId) out.push("mal:" + r.malId);
    if (r.mdId) out.push("md:" + r.mdId);
    return Array.from(new Set(out));
  }

  function merge(mu, al) {
    const out = mu.map((r) => Object.assign({ sources: ["mangaupdates"] }, r));
    al.forEach((a) => {
      const titles = new Set(a.alt.map(norm).filter((t) => t.length > 1));
      const hit = out.find((o) => !o.anilistId && o.muId && o.alt.some((t) => titles.has(norm(t))));
      if (!hit) {
        // Same title as an entry already shown: it's a duplicate listing, skip it.
        if (out.some((o) => o.alt.some((t) => titles.has(norm(t))))) return;
        out.push(Object.assign({ sources: ["anilist"] }, a));
        return;
      }
      hit.anilistId = a.anilistId;
      hit.malId = a.malId;
      if (a.cover) hit.cover = a.cover;
      hit.color = a.color || hit.color;
      hit.banner = a.banner || hit.banner;
      hit.chapters = a.chapters || hit.chapters;
      hit.volumes = a.volumes || hit.volumes;
      hit.score = a.score || hit.score;
      hit.status = a.status || hit.status;
      hit.year = hit.year || a.year;
      if (!hit.genres.length) hit.genres = a.genres;
      hit.alt = uniq(hit.alt.concat(a.alt));
      hit.sources.push("anilist");
    });
    out.forEach((r) => (r.item_key = keyOf(r)));
    return out;
  }

  function rank(list, q) {
    list.forEach((r) => {
      const best = Math.max(0, ...r.alt.concat(r.title, r.sub || "").map((t) => titleScore(q, t)));
      r._match = best;
      r._score =
        best +
        (r.muId ? 4 : 0) +
        (r.sources.length > 1 ? 4 : 0) +
        Math.min(6, Math.log10(1 + (r.votes || 0)) * 2) +
        (r.score ? r.score / 25 : 0) -
        Math.min(6, Math.max(0, norm(r.title).length - norm(q).length) / 10);
    });
    return list.sort((a, b) => b._score - a._score);
  }

  // Server already filters by kind; this only guards against stray rows.
  const muFits = (m, kind) => !m.type || (kind === "lightnovel" ? m.type === "Novel" : m.type === "Manhwa");
  const alFits = (m, kind) => !m.format || (kind === "lightnovel" ? m.format === "NOVEL" : m.format !== "NOVEL");

  /* ---------- session cache ---------- */
  const mem = new Map();
  function cacheGet(k) {
    if (mem.has(k)) return mem.get(k);
    try {
      const all = JSON.parse(sessionStorage.getItem(CACHE_KEY) || "{}");
      if (all[k]) {
        mem.set(k, all[k]);
        return all[k];
      }
    } catch (e) {}
    return null;
  }
  function cacheSet(k, v) {
    mem.set(k, v);
    try {
      const all = JSON.parse(sessionStorage.getItem(CACHE_KEY) || "{}");
      all[k] = v;
      const keys = Object.keys(all);
      if (keys.length > 40) keys.slice(0, keys.length - 40).forEach((x) => delete all[x]);
      sessionStorage.setItem(CACHE_KEY, JSON.stringify(all));
    } catch (e) {}
  }

  async function once(q, kind, signal) {
    const ck = kind + "|" + norm(q);
    const hit = cacheGet(ck);
    if (hit) return { results: hit.map((r) => Object.assign({}, r)), errors: [] };
    const json = (await rpc("search_series", { q, kind }, signal)) || {};
    const mu = (json.mu || []).filter((m) => muFits(m, kind)).map((m) => fromMU(m, kind));
    const al = (json.al || []).filter((m) => alFits(m, kind)).map((m) => fromAniList(m, kind));

  /* Apply one server row locally, last write wins, never re-pushed. */
  function applyRow(r) {
    if (r.id) idMap[r.id] = r.item_key;
    syncedKeys.add(r.item_key);
    const rt = Date.parse(r.updated_at) || 0;
    const q = queue[r.item_key];
    const local = Ink.store.get(r.item_key);
    if (q && q.t >= rt) return; // our pending change is newer
    if (local && (local.updated_at || 0) >= rt) return;
    if (q) delete queue[r.item_key];
    Ink.store.saveItem(fromRow(r), { source: "remote" });
  }

  /* ---------- store hook ---------- */
  function onStore(ch) {
    if (ch.source === "remote") return;
    if (ch.type === "add" || ch.type === "update") queue[ch.key] = { op: "upsert", t: ch.item.updated_at };
    else if (ch.type === "remove") queue[ch.key] = { op: "delete", t: Date.now() };
    else if (ch.type === "import") {
      const now = new Set(Ink.store.getAll().map((i) => i.item_key));
      known.forEach((k) => { if (!now.has(k)) queue[k] = { op: "delete", t: Date.now() }; });
      Ink.store.getAll().forEach((i) => { if (!queue[i.item_key]) queue[i.item_key] = { op: "upsert", t: i.updated_at }; });
    }
    known = new Set(Ink.store.getAll().map((i) => i.item_key));
    if (ch.type === "external") { queue = readJSON(QKEY, queue); return; }
    saveQueue();
    if (ch.type === "import") return fullSync();
    clearTimeout(flushTimer);
    flushTimer = setTimeout(flush, 400);
    render();
  }

  /* ---------- push ---------- */
  async function flush() {
    if (!client || !session) return render();
    if (!navigator.onLine) return setStatus("offline");
    if (flushing) { again = true; return; }
    const entries = Object.entries(queue);
    if (!entries.length) return setStatus("synced");
    flushing = true;
    setStatus("syncing");
    let ok = true;
    const ups = entries.filter(([k, q]) => q.op === "upsert" && Ink.store.has(k));
    const dels = entries.filter(([, q]) => q.op === "delete");
    entries.forEach(([k, q]) => { if (q.op === "upsert" && !Ink.store.has(k)) delete queue[k]; });
    try {
      if (ups.length) {
        const { error } = await client.from("library").upsert(ups.map(([k]) => toRow(Ink.store.get(k))), { onConflict: "user_id,item_key" });
        if (error) throw error;
        ups.forEach(([k, q]) => { syncedKeys.add(k); if (queue[k] && queue[k].t === q.t) delete queue[k]; });
      }
      if (dels.length) {
        const keys = dels.map(([k]) => k);
        const { error } = await client.from("library").delete().eq("user_id", uid).in("item_key", keys);
        if (error) throw error;
        dels.forEach(([k, q]) => { syncedKeys.delete(k); if (queue[k] && queue[k].t === q.t) delete queue[k]; });
      }
    } catch (e) {
      ok = false;
      console.warn("[sync] push failed", e && e.message);
    }
    saveQueue();
    saveSynced();
    flushing = false;
    if (again) { again = false; return flush(); }
    setStatus(ok ? (pending() ? "syncing" : "synced") : navigator.onLine ? "error" : "offline");
  }

  /* ---------- pull + merge ---------- */
  async function pull() {
    if (!client || !session) return false;
    if (!navigator.onLine) { setStatus("offline"); return false; }
    setStatus("syncing");
    lastPull = Date.now();
    const { data, error } = await client.from("library").select("*").eq("user_id", uid);
    if (error) { console.warn("[sync] pull failed", error.message); setStatus("error"); return false; }
    const remote = new Set();
    data.forEach((r) => {
      remote.add(r.item_key);
      const local = Ink.store.get(r.item_key);
      const rt = Date.parse(r.updated_at) || 0;
      const q = queue[r.item_key];
      if (q && q.t >= rt) return; // pending local change or tombstone wins
      if (local && (local.updated_at || 0) > rt) { queue[r.item_key] = { op: "upsert", t: local.updated_at }; idMap[r.id] = r.item_key; return; }
      applyRow(r);
    });
    Ink.store.getAll().forEach((it) => {
      if (remote.has(it.item_key) || queue[it.item_key]) return;
      if (syncedKeys.has(it.item_key)) Ink.store.removeItem(it.item_key, { source: "remote" }); // deleted on another device
      else queue[it.item_key] = { op: "upsert", t: it.updated_at }; // first-time migration
    });
    syncedKeys = remote;
    known = new Set(Ink.store.getAll().map((i) => i.item_key));
    saveQueue();
    saveSynced();
    return true;
  }

  async function fullSync() {
    if (await pull()) await flush();
  }
  function maybePull() {
    if (session && Date.now() - lastPull > 30000) fullSync();
  }

  /* ---------- realtime ---------- */
  function subscribe() {
    unsubscribe();
    channel = client
      .channel("library")
      .on("postgres_changes", { event: "*", schema: "public", table: "library", filter: "user_id=eq." + uid }, (p) => {
        if (p.eventType === "DELETE") {
          const key = (p.old && (p.old.item_key || idMap[p.old.id])) || null;
          if (!key) return;
          syncedKeys.delete(key);
          if (p.old.id) delete idMap[p.old.id];
          if (!queue[key] || queue[key].op === "delete") {
            delete queue[key];
            Ink.store.removeItem(key, { source: "remote" });
          }
        } else if (p.new) applyRow(p.new);
        saveQueue();
        saveSynced();
        render();
      })
      .subscribe();
  }
  function unsubscribe() {
    if (channel && client) client.removeChannel(channel);
    channel = null;
  }

  /* ---------- auth ---------- */
  function cleanUrl() {
    if (/access_token=|refresh_token=|error_description=|type=magiclink/.test(location.hash))
      history.replaceState(null, "", location.pathname + location.search);
  }
  function onAuth(event, s) {
    cleanUrl();
    if (s && (event === "SIGNED_IN" || event === "INITIAL_SESSION")) {
      const fresh = !session || session.user.id !== s.user.id;
      session = s;
      if (!fresh) return render();
      uid = s.user.id;
      syncedKeys = new Set(readJSON(sKey(), []));
      subscribe();
      if (event === "SIGNED_IN" && Ink.ui) Ink.ui.toast("Signed in as " + (s.user.email || "you"));
      fullSync();
    } else if (event === "TOKEN_REFRESHED" || event === "USER_UPDATED") {
      if (s) session = s;
    } else if (!s) {
      unsubscribe();
      session = null;
      uid = null;
      setStatus("local");
    }
  }

  async function boot() {
    try {
      const mod = await import("https://esm.sh/@supabase/supabase-js@2");
      client = mod.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY, {
        auth: { flowType: "implicit", persistSession: true, detectSessionInUrl: true, storage: safeStorage },
      });
      client.auth.onAuthStateChange((e, s) => setTimeout(() => onAuth(e, s), 0));
    } catch (e) {
      client = null; // offline or sandboxed: local-only
    }
    if (hashError && Ink.ui) Ink.ui.toast("That sign-in link didn't work: " + decodeURIComponent(hashError[1].replace(/\+/g, " ")), { timeout: 7000 });
    render();
  }

  window.addEventListener("online", () => fullSync());
  window.addEventListener("offline", () => session && setStatus("offline"));
  document.addEventListener("visibilitychange", () => document.visibilityState === "visible" && maybePull());
  window.addEventListener("focus", maybePull);

  /* ---------- UI ---------- */
  const LABEL = { local: "Local only", syncing: "Syncing…", synced: "Synced", offline: "Offline", error: "Sync error" };
  function setStatus(s) {
    status = session ? s : "local";
    render();
  }

  function sectionHTML() {
    const esc = Ink.ui.esc;
    if (!client) return `<p class="x-desc" style="margin:0">Sync isn't available right now — you may be offline. Your shelf stays saved in this browser.</p>`;
    if (!session)
      return `<p class="x-desc" style="margin:0">Sign in with a one-time email link to keep your shelf in step on every device.</p>
      <form class="x-syncform" data-sync="form" novalidate>
        <input class="x-input x-input--plain" id="sync-email" aria-label="Email" type="email" autocomplete="email" placeholder="you@example.com" required />
        <button class="x-btn is-primary" type="submit">Email me a link</button>
      </form>
      <p class="x-desc" data-sync="msg" role="status" style="margin:0"></p>`;
    const n = pending();
    return `<dl class="x-dl">
        <div><dt>Signed in</dt><dd class="x-syncmail">${esc(session.user.email || "Account")}</dd></div>
        <div><dt>Status</dt><dd><i class="x-pill__dot" data-s="${status}"></i> ${LABEL[status]}</dd></div>
        <div><dt>Waiting</dt><dd>${n} change${n === 1 ? "" : "s"}</dd></div>
      </dl>
      <div class="x-btns"><button class="x-btn is-primary" type="button" data-sync="now">Sync now</button><button class="x-btn is-ghost" type="button" data-sync="out">Sign out</button></div>`;
  }

  function bind(root) {
    const form = root.querySelector('[data-sync="form"]');
    if (form)
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const input = form.querySelector("input");
        const msg = root.querySelector('[data-sync="msg"]');
        const email = input.value.trim();
        if (!/^\S+@\S+\.\S+$/.test(email)) { msg.textContent = "Enter a valid email address."; input.focus(); return; }
        const btn = form.querySelector("button");
        btn.disabled = true;
        msg.textContent = "Sending…";
        try {
          const { error } = await client.auth.signInWithOtp({ email, options: { emailRedirectTo: location.origin + location.pathname } });
          msg.textContent = error ? error.message : "Check your email and open the link on this device.";
        } catch (err) {
          msg.textContent = "Couldn't reach the server. Try again when you're online.";
        }
        btn.disabled = false;
      });
    const now = root.querySelector('[data-sync="now"]');
    if (now) now.addEventListener("click", () => fullSync());
    const out = root.querySelector('[data-sync="out"]');
    if (out)
      out.addEventListener("click", async () => {
        try { await client.auth.signOut(); } catch (e) {}
        onAuth("SIGNED_OUT", null);
        Ink.ui.toast("Signed out — your shelf stays on this device");
      });
  }

  function openSheet() {
    Ink.ui.openSheet(
      `<div class="x-sheet__in">
      <div style="display:flex;align-items:center;gap:10px"><h2 id="sheet-title" style="flex:1">Account &amp; sync</h2><button class="x-iconbtn" data-close aria-label="Close">✕</button></div>
      <div class="x-syncsec" id="sync-sec">${sectionHTML()}</div></div>`,
      (sheet) => bind(sheet)
    );
  }

  function render() {
    const pill = $("#acct-pill");
    if (pill) {
      pill.querySelector(".x-pill__dot").dataset.s = status;
      pill.querySelector(".x-pill__e").textContent = session ? session.user.email || "Account" : "";
      pill.querySelector(".x-pill__s").textContent = LABEL[status];
      pill.setAttribute("aria-label", "Account: " + (session ? (session.user.email || "") + ", " : "") + LABEL[status]);
    }
    const banner = $("#sync-banner");
    if (banner) banner.hidden = !client || !!session || safeStorage.getItem(BKEY) === "1";
    const sec = $("#sync-sec");
    if (sec && !sec.contains(document.activeElement) && !sec.querySelector('[data-sync="msg"]:not(:empty)')) {
      sec.innerHTML = sectionHTML();
      bind(sec);
    }
  }

  function init() {
    $("#acct-pill").addEventListener("click", openSheet);
    $("#sync-banner-go").addEventListener("click", openSheet);
    $("#sync-banner-x").addEventListener("click", () => { safeStorage.setItem(BKEY, "1"); render(); });
    Ink.store.onChange(onStore);
    render();
    boot();
  }

  Ink.sync = { sectionHTML: () => `<div class="x-syncsec" id="sync-sec">${sectionHTML()}</div>`, bind, open: openSheet, flush, fullSync, get status() { return status; } };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
    </script>
  </body>
</html>
